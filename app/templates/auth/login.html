<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Unilever Cloud Operations Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/static/css/portal.css" />
</head>
<body class="auth-page">

<div class="auth-container">
  <div class="auth-card card shadow-sm">
    <div class="auth-card-header">
      <i class="bi bi-cloud-fill fs-3 text-primary mb-2 d-block"></i>
      <h4 class="mb-0 fw-semibold">Cloud Operations Portal</h4>
      <p class="text-muted small mb-0 mt-1">Unilever — DNS Change Management</p>
    </div>

    <div class="card-body px-4 py-4">
      <h5 class="mb-4 text-dark fw-semibold">Sign in to your account</h5>

      {% set flashes = request.session.pop('flash', []) %}
      {% for flash in flashes %}
      <div class="alert alert-{{ flash.category }} alert-dismissible fade show" role="alert">
        {{ flash.message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}

      {% if error %}
      <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" action="/auth/login" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label fw-medium">Email address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="you@unilever.com" required autofocus />
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-medium">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Enter your password" required />
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>
    </div>

    <div class="card-footer bg-transparent text-center py-3">
      <span class="text-muted small">Don't have an account?</span>
      <a href="/auth/register" class="small ms-1 fw-medium">Request access</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmB7WVrAFHxTBZLt6GmNYqJECmU" crossorigin="anonymous"></script>
</body>
</html>
