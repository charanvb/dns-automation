{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height:60vh">
  <i class="bi bi-shield-lock-fill text-danger" style="font-size:4rem"></i>
  <h2 class="mt-3 fw-bold">403 — Access Denied</h2>
  <p class="text-muted">{{ detail or 'You do not have permission to access this page.' }}</p>
  <a href="/dashboard" class="btn btn-primary mt-2">Return to Dashboard</a>
</div>
{% endblock %}
